services:
  - type: web
    name: eshopco-config-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: development
      - key: APP_WORKERS
        value: "7"
      - key: APP_DEBUG
        value: "false"
